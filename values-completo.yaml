COMPUTED VALUES:
affinity: {}
airflowConfigAnnotations: {}
airflowHome: /opt/airflow
airflowLocalSettings: |-
  {{- if semverCompare "<3.0.0" .Values.airflowVersion }}
  {{- if not (or .Values.webserverSecretKey .Values.webserverSecretKeySecretName) }}
  from airflow.www.utils import UIAlert

  DASHBOARD_UIALERTS = [
    UIAlert(
      'Usage of a dynamic webserver secret key detected. We recommend a static webserver secret key instead.'
      ' See the <a href='
      '"https://airflow.apache.org/docs/helm-chart/stable/production-guide.html#webserver-secret-key" '
      'target="_blank" rel="noopener noreferrer">'
      'Helm Chart Production Guide</a> for more details.',
      category="warning",
      roles=["Admin"],
      html=True,
    )
  ]
  {{- end }}
  {{- end }}
airflowPodAnnotations: {}
airflowVersion: 3.2.2
allowJobLaunching: false
allowPodLaunching: true
apiSecretAnnotations: {}
apiServer:
  affinity: {}
  allowPodLogReading: true
  annotations: {}
  args:
  - bash
  - -c
  - exec airflow api-server
  configMapAnnotations: {}
  containerLifecycleHooks: {}
  enabled: true
  env: []
  extraContainers: []
  extraInitContainers: []
  extraVolumeMounts: []
  extraVolumes: []
  hostAliases: []
  hpa:
    behavior: {}
    enabled: false
    maxReplicaCount: 5
    metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 50
          type: Utilization
      type: Resource
    minReplicaCount: 1
  labels: {}
  livenessProbe:
    failureThreshold: 5
    initialDelaySeconds: 15
    periodSeconds: 10
    scheme: HTTP
    timeoutSeconds: 5
  networkPolicy:
    ingress:
      from: []
      ports:
      - port: '{{ .Values.ports.apiServer }}'
  nodeSelector: {}
  podAnnotations: {}
  podDisruptionBudget:
    config:
      maxUnavailable: 1
    enabled: false
  readinessProbe:
    failureThreshold: 5
    initialDelaySeconds: 15
    periodSeconds: 10
    scheme: HTTP
    timeoutSeconds: 5
  replicas: 1
  resources: {}
  securityContexts:
    container: {}
    pod: {}
  service:
    annotations: {}
    loadBalancerSourceRanges: []
    ports:
    - name: api-server
      port: '{{ .Values.ports.apiServer }}'
    type: ClusterIP
  serviceAccount:
    annotations: {}
    automountServiceAccountToken: true
    create: true
  startupProbe:
    failureThreshold: 6
    initialDelaySeconds: 0
    periodSeconds: 10
    scheme: HTTP
    timeoutSeconds: 20
  tolerations: []
  topologySpreadConstraints: []
  waitForMigrations:
    enabled: true
    env: []
    securityContexts:
      container: {}
cleanup:
  affinity: {}
  args:
  - bash
  - -c
  - exec airflow kubernetes cleanup-pods --namespace={{ .Release.Namespace }}
  containerLifecycleHooks: {}
  enabled: false
  env: []
  jobAnnotations: {}
  labels: {}
  nodeSelector: {}
  podAnnotations: {}
  resources: {}
  schedule: '*/15 * * * *'
  securityContext: {}
  securityContexts:
    container: {}
    pod: {}
  serviceAccount:
    annotations: {}
    automountServiceAccountToken: true
    create: true
    serviceAccountTokenVolume:
      enabled: false
      expirationSeconds: 3600
      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      volumeName: kube-api-access
  tolerations: []
  topologySpreadConstraints: []
config:
  celery:
    flower_url_prefix: '{{ ternary "" .Values.ingress.flower.path (eq .Values.ingress.flower.path
      "/") }}'
    sync_parallelism: '{{ include "cpu_count" (((.Values.scheduler).resources).limits).cpu
      }}'
    worker_concurrency: 16
  celery_kubernetes_executor:
    kubernetes_queue: kubernetes
  core:
    auth_manager: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    dags_folder: '{{ include "airflow_dags" . }}'
    executor: '{{ .Values.executor }}'
    load_examples: "False"
  dag_processor:
    dag_bundle_config_list: '{{ include "dag_bundle_config_list" . }}'
  elasticsearch:
    json_format: "True"
    log_id_template: '{dag_id}-{task_id}-{run_id}-{map_index}-{try_number}'
  elasticsearch_configs:
    max_retries: 3
    retry_timeout: "True"
    timeout: 30
  fab:
    enable_proxy_fix: "True"
  kerberos:
    ccache: '{{ .Values.kerberos.ccacheMountPath }}/{{ .Values.kerberos.ccacheFileName
      }}'
    keytab: '{{ .Values.kerberos.keytabPath }}'
    principal: '{{ .Values.kerberos.principal }}'
    reinit_frequency: '{{ .Values.kerberos.reinitFrequency }}'
  kubernetes_executor:
    multi_namespace_mode: '{{ ternary "True" "False" .Values.multiNamespaceMode }}'
    namespace: '{{ .Release.Namespace }}'
    pod_template_file: '{{ include "airflow_pod_template_file" . }}/pod_template_file.yaml'
    worker_container_repository: '{{ .Values.images.airflow.repository | default .Values.defaultAirflowRepository
      }}'
    worker_container_tag: '{{ .Values.images.airflow.tag | default .Values.defaultAirflowTag
      }}'
  logging:
    colored_console_log: "False"
    remote_logging: '{{- ternary "True" "False" (or .Values.elasticsearch.enabled
      .Values.opensearch.enabled) }}'
  metrics:
    otel_host: '{{ if .Values.otelCollector.metricsEnabled }}{{ printf "%s-otel-collector"
      (include "airflow.fullname" .) }}{{ end }}'
    otel_on: '{{ ternary "True" "False" .Values.otelCollector.metricsEnabled }}'
    otel_port: '{{ .Values.ports.otelCollectorOtlpHttp }}'
    statsd_host: '{{ printf "%s-statsd" (include "airflow.fullname" .) }}'
    statsd_on: '{{ ternary "True" "False" (and .Values.statsd.enabled (not .Values.otelCollector.metricsEnabled))
      }}'
    statsd_port: 9125
    statsd_prefix: airflow
  scheduler:
    standalone_dag_processor: '{{ ternary "True" "False" (or (semverCompare ">=3.0.0"
      .Values.airflowVersion) (.Values.dagProcessor.enabled | default false)) }}'
  traces:
    otel_on: '{{ ternary "True" "False" .Values.otelCollector.tracesEnabled }}'
  webserver:
    enable_proxy_fix: "True"
containerLifecycleHooks: {}
createUserJob:
  affinity: {}
  annotations: {}
  applyCustomEnv: true
  args:
  - bash
  - -c
  - |-
    exec \
    airflow users create "$@"
  - --
  - -r
  - '{{ if .Values.webserver.defaultUser }}{{ .Values.webserver.defaultUser.role }}{{
    else }}{{ .Values.createUserJob.defaultUser.role }}{{ end }}'
  - -u
  - '{{ if .Values.webserver.defaultUser }}{{ .Values.webserver.defaultUser.username
    }}{{ else }}{{ .Values.createUserJob.defaultUser.username }}{{ end }}'
  - -e
  - '{{ if .Values.webserver.defaultUser }}{{ .Values.webserver.defaultUser.email
    }}{{ else }}{{ .Values.createUserJob.defaultUser.email }}{{ end }}'
  - -f
  - '{{ if .Values.webserver.defaultUser }}{{ .Values.webserver.defaultUser.firstName
    }}{{ else }}{{ .Values.createUserJob.defaultUser.firstName }}{{ end }}'
  - -l
  - '{{ if .Values.webserver.defaultUser }}{{ .Values.webserver.defaultUser.lastName
    }}{{ else }}{{ .Values.createUserJob.defaultUser.lastName }}{{ end }}'
  - -p
  - '{{ if .Values.webserver.defaultUser }}{{ .Values.webserver.defaultUser.password
    }}{{ else }}{{ .Values.createUserJob.defaultUser.password }}{{ end }}'
  containerLifecycleHooks: {}
  defaultUser:
    email: admin@example.com
    firstName: admin
    lastName: user
    password: admin
    role: Admin
    username: admin
  enabled: true
  env: []
  extraContainers: []
  extraInitContainers: []
  extraVolumeMounts: []
  extraVolumes: []
  jobAnnotations: {}
  labels: {}
  nodeSelector: {}
  resources: {}
  restartPolicy: OnFailure
