  args:
  - bash
  - -c
  - CLEAN_TS=$(date -d "-{{ .Values.databaseCleanup.retentionDays }} days" +"%Y-%m-%dT%H:%M:%S");
    echo "Cleaning up metadata DB entries older than ${CLEAN_TS}"; exec airflow db
    clean --clean-before-timestamp "${CLEAN_TS}" --yes {{- if .Values.databaseCleanup.skipArchive
    }} --skip-archive{{ end }} {{- if .Values.databaseCleanup.verbose }} --verbose{{
    end }} {{- with .Values.databaseCleanup.batchSize }} --batch-size {{ . }}{{ end
    }} {{- with .Values.databaseCleanup.tables }} --tables {{ . | join "," }}{{ end
    }}
  containerLifecycleHooks: {}
  enabled: false
  env: []
  failedJobsHistoryLimit: 1
